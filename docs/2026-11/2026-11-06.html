  <style>
    :root {

      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.18);

    .weather-pill {
      background: rgba(255,255,255,0.18);
      padding: 6px 14px;
      border-radius: 999px;

    .filter-bar {

      margin-bottom: 20px;
      align-items: center;

      background: var(--card);
      color: var(--text);

      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s;
    }
    .filter-btn.active, .filter-btn:hover {

      color: #fff;
      border-color: var(--primary);
    }
    .card-grid {
      display: grid;

      gap: 18px;
    }
    .spot-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;

    .spot-card:hover {

      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.09);
      border-color: #93c5fd;
    }

    .badge.sat { background: var(--amber-soft); color: var(--amber); }
    .badge.sun { background: var(--primary-soft); color: var(--primary); }
    .spot-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; }
    .spot-drive { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
    .spot-summary { font-size: 0.9rem; color: #334155; margin-bottom: 16px; line-height: 1.5; }
    .spot-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed var(--border);
      padding-top: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
    }
    .noodle-tag {
      background: #fffbeb;
      color: #b45309;
      border: 1px solid #fde68a;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;

    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 20px;
      max-width: 560px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      max-height: 90vh;
      overflow-y: auto;

      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;

      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      font-size: 0.92rem;
      line-height: 1.5;

</head>

        card.innerHTML = `
          <div>
            <div class="badges">
              <span class="badge ${s.type === 'outing' ? 'outing' : 'festival'}">${s.badgeType}</span>
              <span class="badge ${s.day === 'sat' ? 'sat' : 'sun'}">${s.badgeDay}</span>
            </div>
            <div class="spot-title">${s.title}</div>
            <div class="spot-drive">${s.drive}</div>
            <div class="spot-summary">${s.summary}</div>
          </div>
          <div class="spot-footer">
            <span class="noodle-tag">${s.noodleTag}</span>
            <span>상세 보기 →</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterSpots(filter, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid(filter);
    }

    function openModal(idx) {
      const s = spots[idx];
      document.getElementById('mBadges').innerHTML = `
        <span class="badge ${s.type === 'outing' ? 'outing' : 'festival'}">${s.badgeType}</span>
        <span class="badge ${s.day === 'sat' ? 'sat' : 'sun'}">${s.badgeDay}</span>
      `;
      document.getElementById('mTitle').textContent = s.title;
      document.getElementById('mDrive').textContent = s.drive;
      document.getElementById('mGirl').textContent = s.girl;
      document.getElementById('mBoy').textContent = s.boy;
      document.getElementById('mTip').textContent = s.tip;
      document.getElementById('mNoodleName').textContent = s.noodleName;
      document.getElementById('mNoodleDesc').textContent = s.noodleDesc;
      document.getElementById('mPlaceLink').href = 'https://map.naver.com/p/search/' + encodeURIComponent(s.placeQuery);
      document.getElementById('mFoodLink').href = 'https://map.naver.com/p/search/' + encodeURIComponent(s.foodQuery);
      document.getElementById('mSiteLink').href = s.siteUrl;
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function openChecklist() {
      document.getElementById('ckBackdrop').classList.add('open');
    }

    function closeChecklist() {
      document.getElementById('ckBackdrop').classList.remove('open');
    }

    renderGrid();
  </script>
</body>
</html>
