    :root {

    * { box-sizing: border-box; margin: 0; padding: 0; }

      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.18);

      margin-bottom: 20px;

      font-size: 0.9rem;
      font-weight: 700;

      white-space: nowrap;

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }
    .spot-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;

    .badge.sat { background: var(--amber-soft); color: var(--amber); }
    .badge.sun { background: var(--primary-soft); color: var(--primary); }
    .spot-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; }
    .spot-drive { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
    .spot-summary { font-size: 0.9rem; color: #334155; margin-bottom: 16px; line-height: 1.5; }
    .spot-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed var(--border);
      padding-top: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
    }
    .noodle-tag {
      background: #fffbeb;
      color: #b45309;
      border: 1px solid #fde68a;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 20px;
      max-width: 560px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      max-height: 90vh;
      overflow-y: auto;

    .modal-header {

      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .close-btn {

      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;

      font-weight: bold;

      padding: 14px;

      font-size: 0.92rem;
      line-height: 1.5;

    .detail-box strong { display: block; margin-bottom: 6px; color: #0f172a; }
    .noodle-detail {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      font-size: 0.92rem;
      line-height: 1.5;

    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .map-btn {

    function renderGrid(filter = 'all') {

        if (filter === 'near' && s.driveMin > 20) return;

        card.className = 'spot-card';
        card.onclick = () => openModal(idx);

        `;

      });
