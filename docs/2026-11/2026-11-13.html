<!DOCTYPE html><html lang="ko"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동탄 주말 나들이</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f1f5f9;color:#1e293b;font-size:13px;line-height:1.4}
header,.on,.mh{background:#059669;color:#fff}
header{padding:12px}
.w{max-width:960px;margin:auto}
.r{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.bx{background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:10px}
button,a.bt{border:1px solid #cbd5e1;background:#f8fafc;color:#334155;padding:5px 9px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none}
.dk{background:#1e293b;color:#fff}
input,select{border:1px solid #cbd5e1;border-radius:8px;padding:5px 8px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;padding-bottom:20px}
.vs{border:2px solid #10b981}
.tg{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:#d1fae5;color:#065f46}
.sb{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:7px;margin:6px 0}
.fd{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:6px 8px;margin:6px 0;display:flex;justify-content:space-between}
.md{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:12px}
.md.op{display:flex}
.mp{background:#fff;max-width:460px;width:100%;border-radius:12px;overflow:hidden}
.mh{padding:10px 14px;display:flex;justify-content:space-between;font-weight:700}
.mb{padding:12px}
</style>
<header><div class="w r">
<div><small>📍 동탄반석로 71 · 👧 7세 딸 & 👦 3세 아들 · 🍜 국수 맛집</small>
<h2>주말 나들이 & 축제 (11.07~11.08)</h2></div>
<div class="r"><small>☀️ 6~18℃ 쾌청</small><button id="ckB">📋 준비물 팩</button></div>
</div></header>
<main class="w" style="padding:10px">
<div id="kpis" class="kp"></div>
<div class="bx r">
<div id="tabs" class="r"></div>
<div class="r"><input id="qIn" placeholder="검색..."><select id="sSel"><option value="r">추천순</option><option value="t">가까운순</option><option value="n">이름순</option></select></div>
</div>
<div class="fd">💡 11월 2주차: 물향기수목원·어린이박물관·남양성모성지·경기아트센터·서울대공원·예스파크</div>
<div id="grid" class="gr"></div>
</main>
<div id="mBox" class="md"><div class="mp"><div class="mh"><span id="mTit"></span><button id="mCls">✕</button></div><div id="mBdy" class="mb"></div></div></div>
<script>
const S=["m|오산 물향기수목원|0|오산 청학로 211|6.5|12~15분|09~17시(월휴)·주차 3천원|곤충생태원, 온실, 단풍잎 관찰 및 솔방울|완만한 숲길 무장애 데크, 유모차 산책, 잔디|방문자센터 유모차 대여, 수유실·기저귀대|두마레칼국수|4분|맑은 바지락칼국수 & 순한 고기만두|https://forest.gg.go.kr/|단풍터널·숲생태", "c|용인 경기도어린이박물관|0|기흥구 상갈로 6|12|18~20분|10~17:30(예약제)·주차 완비|건설현장 체험, 바람의나라 과학원리|1층 아기발달체험실(자연놀이터), 볼풀장|층별 전용 수유실(전자레인지), 유모차E/V|삼동소바 본점|5분|온소바 & 사누끼우동, 돈가스|https://gcm.ggcf.kr/|실내체험·오감발달", "n|화성 남양성모성지 평화정원|0|남양읍 남양성지로 112|23|25~30분|09~18시·넓은 무료주차|마리오보타 대성당, 잔디 조각공원|차없는 넓은 평지 잔디밭, 유모차 산책 최적|순례자센터 1층 아늑한 수유실, 완경사 슬로프|남양 대가손칼국수|3분|담백한 닭칼국수 & 멸치칼국수, 왕만두|https://www.namyangshrine.net/|평화정원·자연치유", "a|수원 경기아트센터 빛축제|1|팔달구 효원로307번길 20|13|18~22분|야간조명 18~22시·지하주차|LED 일루미네이션 터널, 어린이 클래식 버스킹|보행자 전용 대광장 유모차 주행, 빛조형물|대극장 로비 쾌적한 수유실, 야외 평지 슬로프|인계동 본가손칼국수|4분|순한 국물 손칼국수 & 사골칼국수|https://www.ggac.or.kr/|빛축제·야간피크닉", "z|과천 서울대공원 단풍축제|1|과천시 대공원광장로 102|35|35~38분|09~18시·카카오T 주차할인|코끼리열차, 기린·하마 관찰, 장미원 산책|완만한 메인 순환로 유모차 산책, 동물모형|유모차 300대 대여, 쉼터마다 모유수유실|과천 밀마을국수|5분|순하고 구수한 잔치국수 & 들깨칼국수|https://grandpark.seoul.go.kr/|동물원·가을단풍", "y|이천 예스파크 공예축제|1|신둔면 도자예술로62번길|42|38~42분|10~18시·마을 무료주차|도자기 물레 체험, 가을 머그컵 그리기|찰흙 빚기 촉감놀이, 공방거리 유모차 산책|관광안내소 1층 유아휴게실(수유실), 무장애로|신둔 가마솥칼국수|4분|조미료 없는 맑은 해물바지락칼국수|http://2000yespark.or.kr/|도자체험·공예거리"].map(s=>s.split("|"));
let vis=[],fav=[],flt="a",q="",srt="r";
kpis.innerHTML=[["📍 총 추천","6곳(상시3+축제3)"],["🚗 평균 이동","24분(최단 12분)"],["👶 유모차 동선","100% 무장애"],["🍜 국수 맛집","전 코스 맑은육수"]].map(([k,v])=>`<div class="bx"><small>${k}</small><br><b>${v}</b></div>`).join("");
function ren(){
tabs.innerHTML=[["a","전체(6)"],["0","🌳 상시(3)"],["1","🎪 축제(3)"],["n","⚡ 20분이내"],["f","⭐ 찜("+fav.length+")"],["v","✅ 방문("+vis.length+")"]].map(([k,l])=>`<button data-f="${k}" class="${flt===k?"on":""}">${l}</button>`).join("");
let L=S.filter(x=>(!q||x.some(s=>s.includes(q)))&&(flt==="a"||flt===x[2]||(flt==="n"&&+x[4]<=20)||(flt==="f"&&fav.includes(x[0]))||(flt==="v"&&vis.includes(x[0]))));
if(srt==="t")L.sort((a,b)=>a[4]-b[4]);
if(srt==="n")L.sort((a,b)=>a[1].localeCompare(b[1]));
grid.innerHTML=L.map(x=>`<div class="bx ${vis.includes(x[0])?"vs":""}">
<div class="r"><span class="tg">${+x[2]?"🎪 축제":"🌳 상시"} · ${x[14]}</span><button data-a="f" data-i="${x[0]}">${fav.includes(x[0])?"★ 찜":"☆"}</button></div>
<h3>${x[1]}</h3>
<b>🚗 자차 ${x[5]} · ${x[3]}</b>
<div class="sb"><div>👧 <b>7세:</b> ${x[7]}</div><div>👦 <b>3세:</b> ${x[8]}</div></div>
<div class="fd"><span>🍜 <b>${x[10]}</b> (${x[11]})</span><b>${x[12]}</b></div>
<div class="r"><button class="dk" data-a="d" data-i="${x[0]}">상세 가이드</button><button class="${vis.includes(x[0])?"on":""}" data-a="v" data-i="${x[0]}">${vis.includes(x[0])?"✓ 다녀왔음":"다녀왔어요"}</button></div>
</div>`).join("");
}
tabs.onclick=e=>{let b=e.target.closest("button");if(b){flt=b.dataset.f;ren();}};
grid.onclick=e=>{
let b=e.target.closest("button");if(!b)return;
let {a,i}=b.dataset,x=S.find(s=>s[0]===i);
if(a==="f"){fav.includes(i)?fav.splice(fav.indexOf(i),1):fav.push(i);ren();}
if(a==="v"){vis.includes(i)?vis.splice(vis.indexOf(i),1):vis.push(i);ren();}
if(a==="d"&&x){
mTit.textContent=x[1];
mBdy.innerHTML=`<div class="sb"><b>🚗 이동:</b> 자차 ${x[5]} (${x[3]})<br><b>🕒 운영·주차:</b> ${x[6]}</div>
<div class="sb">👧 <b>7세:</b> ${x[7]}<br>👦 <b>3세:</b> ${x[8]}<br>👶 <b>편의:</b> ${x[9]}</div>
<div class="fd"><span>🍜 <b>${x[10]}</b> (${x[11]})</span> - ${x[12]}</div>
<div class="r"><a href="${x[13]}" target="_blank" class="bt on">🌐 공식 홈페이지</a><button onclick="mBox.classList.remove('op')">닫기</button></div>`;
mBox.classList.add("op");
}
};
ckB.onclick=()=>{
mTit.textContent="📋 주말 나들이 필수 준비물 팩";
mBdy.innerHTML=[["👧 7세 딸",["가을 숲체험 얇은 바람막이","간편 텀블러·보온물병","운동화·여벌 양말","야외 돗자리·간식"]],["👦 3세 아들",["경량 유모차","국수용 실리콘 가위","기저귀 5개·물티슈","체온조절용 여벌 겉옷"]],["👨‍👩‍👧‍👦 공통 필수",["피크닉 매트·무릎담요","비상 상비약(밴드·연고)","물티슈·휴지"]]].map(([t,items])=>`<div class="sb"><b>${t}</b>${items.map(l=>`<label style="display:flex;gap:6px"><input type="checkbox">${l}</label>`).join("")}</div>`).join("");
mBox.classList.add("op");
};
mCls.onclick=()=>mBox.classList.remove("op");
mBox.onclick=e=>{if(e.target===mBox)mBox.classList.remove("op");};
qIn.oninput=e=>{q=e.target.value;ren();};
sSel.onchange=e=>{srt=e.target.value;ren();};
ren();
</script></html>
