<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>은우·우준이 주말 나들이 &amp; 행사 대시보드 (10.24~10.25)</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --green: #059669;
      --green-soft: #d1fae5;
      --purple: #7c3aed;
      --purple-soft: #ede9fe;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    }
    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      color: #fff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.18);
    }
    header .sub { font-size: 0.85rem; opacity: 0.9; margin-bottom: 6px; }
    header h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 12px; }
    .weather-strip { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.88rem; }
    .weather-pill {
      background: rgba(255,255,255,0.18);
      padding: 6px 14px;
      border-radius: 999px;
    }
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
      align-items: center;
    }
    .filter-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }
    .spot-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .spot-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.09);
      border-color: #93c5fd;
    }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .badge { font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
    .badge.outing { background: var(--green-soft); color: var(--green); }
    .badge.festival { background: var(--purple-soft); color: var(--purple); }
    .badge.sat { background: var(--amber-soft); color: var(--amber); }
    .badge.sun { background: var(--primary-soft); color: var(--primary); }
    .spot-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; }
    .spot-drive { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
    .spot-summary { font-size: 0.9rem; color: #334155; margin-bottom: 16px; line-height: 1.5; }
    .spot-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed var(--border);
      padding-top: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
    }
    .noodle-tag {
      background: #fffbeb;
      color: #b45309;
      border: 1px solid #fde68a;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 20px;
      max-width: 560px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .close-btn {
      background: #f1f5f9;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: bold;
      flex-shrink: 0;
    }
    .detail-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .detail-box strong { display: block; margin-bottom: 6px; color: #0f172a; }
    .noodle-detail {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .map-btn {
      flex: 1;
      min-width: 140px;
      text-align: center;
      background: #03c75a;
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
    }
    .map-btn.sub { background: #2563eb; }
    .map-btn.site { background: #475569; }
    .check-label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; font-size: 0.9rem; }
  </style>
</head>
