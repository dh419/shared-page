name: Test Search Grounding

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google GenAI SDK
        run: pip install google-genai
      - name: Run Test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API || secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os
          from google import genai
          from google.genai import types
          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          
          print('--- Test 1: gemini-3.8-flash plain ---')
          try:
              res = client.models.generate_content(model='gemini-3.8-flash', contents='안녕')
              print('Test 1 OK:', res.text[:50])
          except Exception as e:
              print('Test 1 FAIL:', e)

          print('--- Test 2: gemini-3.8-flash with Google Search ---')
          try:
              res = client.models.generate_content(
                  model='gemini-3.8-flash',
                  contents='오늘 서울 날씨 어때?',
                  config=types.GenerateContentConfig(tools=[types.Tool(google_search=types.GoogleSearch())])
              )
              print('Test 2 OK:', res.text[:50])
          except Exception as e:
              print('Test 2 FAIL:', e)
          "
