name: Sync Dashboard from Google Drive

on:
  schedule:
    # 매주 금요일 오전 07:00 KST (UTC 목요일 22:00) 자동 동기화 감지
    - cron: '0 22 * * 4'
  workflow_dispatch:        # 필요시 수동 즉시 실행 가능

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Download New Reports from Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_NAME: 'Dashboard_Incoming'
        run: |
          python scripts/sync_gdrive.py

      - name: Update Hub Index Data
        run: |
          python scripts/update_index.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ hub-data.json
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(dashboard): auto-sync weekly report to docs/ and update index [skip ci]"
            git push origin main
          fi
