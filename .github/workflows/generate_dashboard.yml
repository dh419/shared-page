name: Generate and Publish Weekly Dashboard

on:
  schedule:
    # 매주 금요일 오후 16:00 KST (UTC 금요일 07:00) 자동 무인 실행
    - cron: '0 7 * * 5'
  workflow_dispatch: # 웹에서 필요할 때 수동 즉시 실행 가능

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google GenAI SDK
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Gemini Search & Generate Dashboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_dashboard.py

      - name: Update Hub Index Data
        run: |
          python scripts/update_index.py

      - name: Commit and Push Changes to Pages
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ hub-data.json
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(dashboard): auto-generate weekly dashboard via Gemini API [skip ci]"
            git push origin main
          fi
