name: Generate and Publish Weekly Dashboard

on:
  schedule:
    # 매주 금요일 오후 16:00 KST (UTC 금요일 07:00) 자동 무인 실행
    - cron: '0 7 * * 5'
  workflow_dispatch:
    inputs:
      model:
        description: 'Gemini 모델 선택'
        required: false
        default: 'gemini-3.8-flash'
        type: choice
        options:
          - 'gemini-3.8-flash'
          - 'gemini-4-argon'
      thinking_budget:
        description: 'Thinking 추론 예산 (토큰 수, 0이면 비활성화)'
        required: false
        default: '1024'
        type: string

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google GenAI SDK
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Gemini Search & Generate Dashboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model || 'gemini-3.8-flash' }}
          THINKING_BUDGET: ${{ inputs.thinking_budget || '1024' }}
        run: |
          python scripts/generate_dashboard.py

      - name: Update Hub Index Data
        run: |
          python scripts/update_index.py

      - name: Commit and Push Changes to Pages
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ hub-data.json
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(dashboard): auto-generate weekly dashboard via Gemini API [skip ci]"
            git push origin main
          fi
